[workspace]
members = ["tuxflow-core", "vendor/iced_term"]
# The spike is a frozen record with its own lockfile; it consumes
# vendor/iced_term as an external path dep.
exclude = ["spike"]

# ONE version for the .deb and every binary in it: the update chip compares
# the running binary's CARGO_PKG_VERSION against the latest release, so
# every package must inherit this rather than carry its own.
# scripts/release.sh bumps the first `version = ` line, which is this one.
[workspace.package]
version = "0.2.4"

# The app: the iced shell, built on the vendored iced_term fork.
[package]
name = "tuxflow"
version.workspace = true
edition = "2024"
license = "MIT"
description = "A Linux-native dev environment manager"
authors = ["Nikola Markovic"]
repository = "https://github.com/markovic-nikola/tuxflow"
homepage = "https://markovic-nikola.github.io/tuxflow/"
readme = "README.md"
default-run = "tuxflow"

[[bin]]
name = "tuxflow"
path = "src/main.rs"

[[bin]]
name = "tuxflow-mcp"
path = "src/bin/tuxflow-mcp.rs"

[dependencies]
tuxflow-core = { path = "tuxflow-core" }
iced_term = { path = "vendor/iced_term" }
# `image` is what draws project avatars (PNG/WEBP/ICO); `svg` already came
# free with the vendored fork's resvg and handles the vector half.
iced = { version = "0.14.0", features = ["tokio", "svg", "canvas", "image"] }
alacritty_terminal = "0.25.1"
tokio = { version = "1.53.1", features = ["time"] }
log = "0.4.34"
open = "5"
env_logger = "0.11.11"
arboard = "3"
png = "0.18"
dirs = "6"
# Desktop notifications over ONE app-lifetime bus connection (see notify.rs);
# already in the tree through iced, so this costs no build.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[package.metadata.deb]
maintainer = "Nikola Markovic <markovic-nikola@users.noreply.github.com>"
copyright = "2026, TuxFlow Contributors"
# $auto resolves the shared libraries the binary actually links (X11,
# Wayland, fontconfig, ...); there is no toolkit runtime to name any more.
depends = "$auto"
recommends = "pulseaudio-utils"
section = "devel"
priority = "optional"
assets = [
	[
		"target/release/tuxflow",
		"usr/bin/",
		"755",
	],
	[
		"target/release/tuxflow-mcp",
		"usr/bin/",
		"755",
	],
	[
		"data/com.tuxflow.TuxFlow.desktop",
		"usr/share/applications/",
		"644",
	],
	[
		"data/com.tuxflow.TuxFlow.metainfo.xml",
		"usr/share/metainfo/",
		"644",
	],
	[
		"data/icons/hicolor/scalable/apps/com.tuxflow.TuxFlow.svg",
		"usr/share/icons/hicolor/scalable/apps/",
		"644",
	],
	[
		"README.md",
		"usr/share/doc/tuxflow/",
		"644",
	],
]
extended-description = """\
TuxFlow lets developers manage their entire dev environment from one window — \
start/stop/restart dev servers, run multiple AI coding agents side by side, \
follow their output and status, and expose an MCP server so AI agents \
can observe and control neighboring processes."""
