[package]
name = "tuxflow-iced"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "TuxFlow's iced shell — the GNOME-stack exit, built on the vendored iced_term fork"

[dependencies]
tuxflow-core = { path = "../tuxflow-core" }
iced_term = { path = "../vendor/iced_term" }
# `image` is what draws project avatars (PNG/WEBP/ICO); `svg` already came
# free with the vendored fork's resvg and handles the vector half.
iced = { version = "0.14.0", features = ["tokio", "svg", "canvas", "image"] }
alacritty_terminal = "0.25.1"
tokio = { version = "1.53.1", features = ["time"] }
log = "0.4.34"
open = "5"
env_logger = "0.11.11"
arboard = "3"
png = "0.18"
dirs = "6"
notify-rust = "4"
