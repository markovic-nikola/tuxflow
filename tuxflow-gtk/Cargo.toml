# The retired GTK4/libadwaita shell. It keeps building (CI still covers it)
# until it is deleted, but nothing ships it: the .deb and the release
# tarball carry the root package only.
[package]
name = "tuxflow-gtk"
version.workspace = true
edition = "2024"
license = "MIT"
description = "The retired GTK4/libadwaita shell of TuxFlow; kept building until it is deleted, not shipped"
publish = false

# The lib keeps its `tuxflow` crate name so `tuxflow::`/`crate::` paths in
# its modules, tests and examples still resolve.
[lib]
name = "tuxflow"
path = "src/lib.rs"

[[bin]]
name = "tuxflow-gtk"
path = "src/main.rs"

[dependencies]
tuxflow-core = { path = "../tuxflow-core" }
gtk4 = { version = "0.11", features = ["v4_14"] }
gdk4-x11 = { version = "0.11", features = ["xlib"] }
x11 = { version = "2.21", features = ["xlib"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
vte4 = { version = "0.10", features = ["v0_76"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
glob = "0.3"
dirs = "6"
nix = { version = "0.29", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
