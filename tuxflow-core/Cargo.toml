[package]
name = "tuxflow-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "TuxFlow's GUI-independent heart: remote/tmux orchestration, config, detection, port scanning, MCP"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
log = "0.4"
thiserror = "2"
dirs = "6"
glob = "0.3"
# Restart-on-file-change (util/watch.rs): the debounced directory watch
# both shells consume.
notify = "7"
notify-debouncer-mini = "0.5"
# The release check + .deb download (util/update.rs), both shells.
ureq = { version = "3", features = ["json"] }
nix = { version = "0.29", features = ["signal", "process"] }
rmcp = { version = "1.2", features = ["server", "transport-io"] }
# Diff syntax highlighting for the Git Changes view. Lives here, not in a
# shell, because it emits plain (line, offset, len, hex) tuples — GTK turns
# them into TextTags, iced into text spans.
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-onig",
] }

[dev-dependencies]
tempfile = "3"
