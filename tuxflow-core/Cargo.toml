[package]
name = "tuxflow-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "TuxFlow's GUI-independent heart: remote/tmux orchestration, config, detection, port scanning, MCP"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
log = "0.4"
thiserror = "2"
dirs = "6"
glob = "0.3"
nix = { version = "0.29", features = ["signal", "process"] }
rmcp = { version = "1.2", features = ["server", "transport-io"] }

[dev-dependencies]
tempfile = "3"
